<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t d">
  <title id="t">Emulation versus KVM</title>
  <desc id="d">Without KVM, a translator converts every guest instruction in software before the real CPU runs it. With KVM, guest instructions run directly on the real CPU.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect width="780" height="330" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111827">
    <text x="40" y="36" font-size="20" font-weight="bold">What KVM does</text>
    <text x="40" y="76" font-size="16" font-weight="bold">Without KVM: emulation (slow)</text>
    <rect x="40" y="90" width="170" height="64" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <text x="125" y="127" font-size="15" text-anchor="middle">Program in the VM</text>
    <line x1="210" y1="122" x2="262" y2="122" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <rect x="270" y="90" width="250" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="395" y="117" font-size="15" text-anchor="middle">Software translates every</text>
    <text x="395" y="138" font-size="15" text-anchor="middle">instruction, one at a time</text>
    <line x1="520" y1="122" x2="572" y2="122" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <rect x="580" y="90" width="160" height="64" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <text x="660" y="127" font-size="15" text-anchor="middle">The real CPU</text>
    <text x="40" y="184" font-size="14">Result: many times slower. The VM would feel stuck.</text>
    <text x="40" y="236" font-size="16" font-weight="bold">With KVM: hardware assist (what we have)</text>
    <rect x="40" y="250" width="170" height="64" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <text x="125" y="287" font-size="15" text-anchor="middle">Program in the VM</text>
    <line x1="210" y1="282" x2="572" y2="282" stroke="#15803d" stroke-width="3" marker-end="url(#a)"/>
    <text x="391" y="272" font-size="15" text-anchor="middle">runs directly on the real CPU</text>
    <rect x="580" y="250" width="160" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="660" y="287" font-size="15" text-anchor="middle">The real CPU</text>
  </g>
</svg>
