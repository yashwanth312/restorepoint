<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d">
  <title id="t">Phase 0 speed test results</title>
  <desc id="d">Three panels. Plain CPU loop: Proxmox 2.1 seconds, test VM 3.2 seconds, pass line 4.2 seconds. Boot: about 6.6 seconds against a 90 second line. Hashing: Proxmox 1.3 seconds, test VM 6.5 seconds, above the 2.6 second line with the cause not yet found.</desc>
  <rect width="780" height="470" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111827">
    <text x="40" y="34" font-size="20" font-weight="bold">What we measured (shorter bar is faster)</text>
    <text x="40" y="70" font-size="16" font-weight="bold">A. Plain CPU loop: count to 3 million</text>
    <text x="40" y="100" font-size="14">Proxmox layer</text>
    <rect x="200" y="86" width="210" height="20" fill="#15803d"/><text x="418" y="101" font-size="14">2.1 s</text>
    <text x="40" y="132" font-size="14">Test VM</text>
    <rect x="200" y="118" width="321" height="20" fill="#15803d"/><text x="529" y="133" font-size="14">3.2 s (1.5x)</text>
    <text x="200" y="162" font-size="14" font-weight="bold">Under the line: PASS</text>
    <line x1="619" y1="78" x2="619" y2="146" stroke="#374151" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="627" y="96" font-size="13">pass line</text><text x="627" y="112" font-size="13">(2x = 4.2 s)</text>
    <text x="40" y="190" font-size="16" font-weight="bold">B. Boot: reset to login prompt</text>
    <text x="40" y="220" font-size="14">Test VM</text>
    <rect x="200" y="206" width="33" height="20" fill="#15803d"/><text x="241" y="221" font-size="14">about 6.6 s: PASS, far under the line</text>
    <line x1="650" y1="198" x2="650" y2="234" stroke="#374151" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="642" y="248" font-size="13" text-anchor="end">pass line: 90 s</text>
    <text x="40" y="300" font-size="16" font-weight="bold">C. Hashing 2 GB: heavy maths, like backup tools do</text>
    <text x="40" y="330" font-size="14">Proxmox layer</text>
    <rect x="200" y="316" width="92" height="20" fill="#15803d"/><text x="300" y="331" font-size="14">1.3 s</text>
    <text x="40" y="362" font-size="14">Test VM</text>
    <rect x="200" y="348" width="455" height="20" fill="#c2410c"/><text x="663" y="363" font-size="14">6.5 s (4.9x)</text>
    <line x1="385" y1="308" x2="385" y2="376" stroke="#374151" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="393" y="326" font-size="13">pass line (2x = 2.6 s)</text>
    <text x="40" y="408" font-size="14">Above the line, so not a pass. Cause not found yet. Kernel work was equal on both sides</text>
    <text x="40" y="428" font-size="14">(0.39 s vs 0.31 s), so it does not look like general slowness. We will recheck in Phase 2.</text>
  </g>
</svg>
